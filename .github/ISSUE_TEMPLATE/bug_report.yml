name: Bug Report
description: Report a bug or unexpected behavior in pisama-core
title: "[Bug]: "
labels: ["bug", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code or trace sample that reproduces the issue.
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: pisama-core Version
      description: Run `pip show pisama-core` to find the version.
      placeholder: "1.6.3"
    validations:
      required: true

  - type: dropdown
    id: adapter
    attributes:
      label: Adapter / Ingestion Path
      options:
        - LangGraph
        - n8n
        - Dify
        - OpenClaw
        - Semantic Kernel
        - Claude Managed Agents
        - OpenAI Assistants / Responses
        - Bedrock Agents
        - Generic OTEL
        - None — direct detector call
        - Other
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: "3.11.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this bug hasn't been reported
          required: true
