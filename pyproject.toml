[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pisama-core"
version = "1.10.2"
description = "Core detection, scoring, and healing engine for Pisama agent forensics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Pisama Team", email = "team@pisama.ai" }
]
keywords = [
    "ai",
    "agents",
    "monitoring",
    "forensics",
    "self-healing",
    "observability"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
tokenization = [
    "cryptography>=41.0.0",  # AES-256-GCM encryption
]
tokenization-linux = [
    "cryptography>=41.0.0",
    "secretstorage>=3.3.0",  # Linux Secret Service keychain
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://pisama.ai"
Documentation = "https://docs.pisama.ai"
Repository = "https://github.com/Pisama-AI/pisama-core"
Issues = "https://github.com/Pisama-AI/pisama-core/issues"
Changelog = "https://github.com/Pisama-AI/pisama-core/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pisama_core"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
